<div class="row login-container" data-hook="">
  <div id="content" class="col-sm-12" data-hook="">
    <div class="col-md-5 col-sm-8 col-xs-11 col-centered">
      <div class="panel panel-default">
        <div id="existing-customer" class="panel-body" data-hook="login">
          <div class="auth-logo">
            <img src="../assets/OMG.png" />
          </div>
          <!-- <div class="panel-heading">
            <h3 class="panel-title">E-mail</h3>
          </div> -->
          <app-login-form></app-login-form>
          <!-- <div>or</div>
          <div class="login-button-container">
            <app-login-facebook></app-login-facebook>
          </div> -->
          <div class="login-link-container small text-muted">
            <p *ngIf="checkUrl()">
              Don't have an account?&nbsp;
              <a class="login-link text-primary" [routerLink]="registerLink()" preserveQueryParams>Sign Up</a>
            </p>
            <p>
              Forgot your password?&nbsp;
              <a class="login-link text-primary" routerLink="/auth/forgot">Reset it</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
