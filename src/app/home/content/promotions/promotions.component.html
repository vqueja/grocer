  <div class="promo_overlay" [hidden]="bClose">

    <div class="promoDetails">
      <span class="close-btn"><button class="btn-primary close-btn" (click)="close()" ><span class="glyphicon glyphicon-remove"></span></button></span>
      <div class="main_info">
        <img src="../assets/con.png" style="width:100%; height: 100%" />
        <h2 class="details">Enjoy P{{discount | number:'1.2-2' }} off your <br><br> grocery from <br><br>{{startDate}} to {{endDate}}!</h2>
        <div class="duration">{{startTime}} - {{endTime}}</div>
      </div>
      <div class="mid_info">
        <h1>Christmas Countdown</h1>
      </div>
      <div class="timer_info">
        <div id="timer" class="eventTimer">
          <div>
            <span class="days">{{countdownDays}}</span>
            <div class="smalltext">Days</div>
          </div>
          <div>
            <span class="hours">{{countdownHours}}</span>
            <div class="smalltext">Hours</div>
          </div>
          <div>
            <span class="minutes">{{countdownMinutes}}</span>
            <div class="smalltext">Minutes</div>
          </div>
          <div>
            <span class="seconds">{{countdownSeconds}}</span>
            <div class="smalltext">Seconds</div>
          </div>
      </div>
    </div>
  </div>
