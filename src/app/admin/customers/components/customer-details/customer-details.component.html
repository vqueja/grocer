<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a [routerLink]="['/admin/customers']">Customers</a></li>
    <li class="breadcrumb-item text-primary" aria-current="page">Details</li>
  </ol>
</nav>
<form class="form-inline small" [formGroup]="customerForm">
  <div class="row">
    <div class="col-sm-12 form-group">
      <label for="address">Username:</label>
      <input type="text" formControlName="username" class="form-control" placeholder="Username">
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 form-group">
      <label for="city">Name:</label>
      <input type="text" formControlName="name" class="form-control" placeholder="Name">
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 form-group">
      <label for="city">Email:</label>
      <input type="text" formControlName="email" class="form-control" placeholder="Email">
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 form-group">
      <label for="country">Date of Birth:</label>
      <input type="text" formControlName="birthdate" class="form-control" placeholder="Date of Birth">
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 form-group">
      <label for="country">Mobile Number:</label>
      <input type="text" formControlName="mobileNumber" class="form-control" placeholder="Mobile Number">
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12 form-group">
      <label for="country">Gender:</label>
      <input type="text" formControlName="gender" class="form-control" placeholder="Gender">
    </div>
  </div>
</form>
